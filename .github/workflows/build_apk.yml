name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Flutter
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar plataforma Android oficial
        run: |
          rm -rf android
          flutter create --platforms=android --org com.universidad --project-name control_notas_app .

      - name: Obtener dependencias
        run: flutter pub get

      - name: Compilar APK en Release
        run: flutter build apk --release

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
