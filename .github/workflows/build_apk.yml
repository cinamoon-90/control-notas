name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Flutter
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar plataforma Android oficial
        run: |
          rm -rf android
          flutter create --platforms=android --org com.universidad --project-name control_notas_app .
          chmod +x android/gradlew

      - name: Aceptar licencias de Android
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Obtener dependencias
        run: flutter pub get

      - name: Diagnóstico de Flutter
        run: flutter doctor -v

      - name: Compilar APK
        run: |
          echo "Iniciando compilación de APK..."
          flutter build apk --debug --no-tree-shake-icons > build.log 2>&1 || {
            echo "================ LOG DE ERROR DE GRADLE ================"
            grep -i -C 5 "FAILURE" build.log || tail -n 100 build.log
            echo "========================================================"
            exit 1
          }
          echo "Compilación exitosa. Generando versión Release..."
          flutter build apk --release --no-tree-shake-icons || true

      - name: Subir APKs generados
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-apks
          path: build/app/outputs/flutter-apk/*.apk

      - name: Subir log de error si falla
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-log
          path: build.log
