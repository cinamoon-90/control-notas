name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Flutter
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar plataforma Android oficial
        run: |
          rm -rf android
          flutter create --platforms=android --org com.universidad --project-name control_notas_app .
          chmod +x android/gradlew

      - name: Aceptar licencias de Android
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Obtener dependencias
        run: flutter pub get

      - name: Compilar APK Debug
        run: |
          echo "Compilando versión Debug..."
          flutter build apk --debug > build_debug.log 2>&1 || {
            echo "### ERROR EN BUILD DEBUG" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build_debug.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build_debug.log
            exit 1
          }

      - name: Compilar APK Release
        run: |
          echo "Compilando versión Release..."
          flutter build apk > build_release.log 2>&1 || {
            echo "### ERROR EN BUILD RELEASE" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build_release.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          }

      - name: Subir APKs generados
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-apk-instalable
          path: |
            build/app/outputs/flutter-apk/*.apk
            *.log
