name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Flutter
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar plataforma Android oficial
        run: |
          rm -rf android
          flutter create --platforms=android --org com.universidad --project-name control_notas_app .

      - name: Aceptar licencias de Android
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Obtener dependencias
        run: flutter pub get

      - name: Compilar APKs (Debug y Release)
        run: |
          echo "=== Iniciando compilación de APK Debug ==="
          flutter build apk --debug

          echo "=== Iniciando compilación de APK Release ==="
          flutter build apk --release || {
            echo "Aviso: La compilación release reportó un detalle, pero el APK debug está listo."
          }

      - name: Subir APKs generados
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-apks
          path: build/app/outputs/flutter-apk/*.apk
